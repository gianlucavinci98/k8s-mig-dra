apiVersion: batch/v1
kind: Job
metadata:
  name: @@JOB_NAME@@
  namespace: experiment
  labels:
    app.kubernetes.io/name: gpu-matmul-benchmark
    benchmark.thesis/experiment: baseline-medium
    benchmark.thesis/service-class: @@SERVICE_CLASS@@
    benchmark.thesis/profile: @@PROFILE_LABEL@@
    kueue.x-k8s.io/queue-name: baseline-medium-uq
    kueue.x-k8s.io/priority-class: @@PRIORITY_CLASS@@
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-matmul-benchmark
        benchmark.thesis/experiment: baseline-medium
        benchmark.thesis/service-class: @@SERVICE_CLASS@@
        benchmark.thesis/profile: @@PROFILE_LABEL@@
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: benchmark
          image: gianlucavinci98/gpu-matmul-benchmark:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gpu-matmul-benchmark-config
          env:
            - name: EXPECTED_PROFILE
              value: @@EXPECTED_PROFILE@@
            - name: EXPECTED_MULTIPROCESSORS
              value: "@@EXPECTED_SMS@@"
            - name: CLAIM_TEMPLATE
              value: @@CLAIM_TEMPLATE@@
            - name: EXPERIMENT_ARM
              value: baseline-medium
            - name: SERVICE_CLASS
              value: @@SERVICE_CLASS@@
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
          resources:
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: @@CLAIM_TEMPLATE@@
