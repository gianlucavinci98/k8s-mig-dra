apiVersion: batch/v1
kind: Job
metadata:
  name: baseline-large-gold-01
  namespace: experiment
  labels:
    app.kubernetes.io/name: gpu-matmul-benchmark
    benchmark.thesis/experiment: baseline-large
    benchmark.thesis/service-class: gold
    benchmark.thesis/profile: large
    kueue.x-k8s.io/queue-name: baseline-large-uq
    kueue.x-k8s.io/priority-class: gold-priority
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-matmul-benchmark
        benchmark.thesis/experiment: baseline-large
        benchmark.thesis/service-class: gold
        benchmark.thesis/profile: large
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: benchmark
          image: gianlucavinci98/gpu-matmul-benchmark:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gpu-matmul-benchmark-config
          env:
            - name: EXPECTED_PROFILE
              value: large-3g
            - name: EXPECTED_MULTIPROCESSORS
              value: "42"
            - name: CLAIM_TEMPLATE
              value: claim-large
            - name: EXPERIMENT_ARM
              value: baseline-large
            - name: SERVICE_CLASS
              value: gold
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
          resources:
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: claim-large
---
