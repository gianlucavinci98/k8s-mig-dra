apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-calibration-small
  namespace: experiment
  labels:
    app.kubernetes.io/name: gpu-matmul-benchmark
    benchmark.thesis/profile: small
    kueue.x-k8s.io/queue-name: baseline-medium-uq
    kueue.x-k8s.io/priority-class: bronze-priority
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-matmul-benchmark
        benchmark.thesis/profile: small
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: benchmark
          image: gianlucavinci98/gpu-matmul-benchmark:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gpu-matmul-benchmark-config
          env:
            - name: EXPECTED_PROFILE
              value: small-1g
            - name: EXPECTED_MULTIPROCESSORS
              value: "14"
            - name: CLAIM_TEMPLATE
              value: claim-small
            - name: EXPERIMENT_ARM
              value: calibration-small
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
          resources:
            # requests:
            #   cpu: 500m
            #   memory: 1Gi
            # limits:
            #   cpu: "2"
            #   memory: 4Gi
            claims:
              - name: gpu
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: claim-small
