apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: claim-fast
  namespace: experiment
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: mig-fast
            count: 1

