apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: "dflex-cq"
spec:
  namespaceSelector: { "experiment" }
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources:
        - mig-small
        - mig-fast
      flavors:
        - name: default-flavor
          resources:
            - name: mig-small
              nominalQuota: 1
            - name: mig-fast
              nominalQuota: 2

